<div class="authors-list" style="margin-top: 2rem;">
  {{ range $id, $author := .Site.Data.authors.authors }}
  <div class="author-entry" style="display: flex; align-items: flex-start; margin-bottom: 2rem; padding: 1.5rem; background: #1e2030; border-radius: 12px; border: 1px solid #363a4f;">
    <img src="{{ relURL $author.image }}" alt="{{ $author.name }}" style="width: 100px; height: 100px; border-radius: 50%; margin-right: 2rem; background: #363a4f; padding: 5px; object-fit: cover; flex-shrink: 0;">
    <div>
      <h2 style="color: #8aadf4 !important; margin: 0; border: none; font-size: 1.5rem;">
        <a href="{{ "authors/" | relURL }}{{ $id | urlize }}" style="text-decoration: none; color: inherit;">{{ $author.name }}</a>
      </h2>
      <p style="color: #c6a0f6; font-size: 1.1rem; margin: 5px 0;">{{ $author.role }}</p>
      <p style="color: #cad3f5; line-height: 1.6; margin: 10px 0; font-size: 0.95rem;">{{ $author.bio }}</p>
      <div style="margin-top: 10px; display: flex; gap: 15px;">
        {{ range $key, $value := $author.links }}
          <a href="{{ $value }}" target="_blank" style="color: #8aadf4; text-decoration: underline; font-size: 0.9rem;">{{ $key | title }}</a>
        {{ end }}
      </div>
    </div>
  </div>
  {{ end }}
</div>
